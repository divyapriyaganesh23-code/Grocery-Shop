<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shop Owner Admin Sign In - FreshCart</title>
  
  <link rel="icon" href="images/categories/fruits.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/owner.css">
  <link rel="stylesheet" href="css/responsive.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body style="background:#0e2817; min-height:100vh; display:flex; flex-direction:column;">

  <!-- Header -->
  <header class="main-header" style="background:#113820; border-bottom:1px solid rgba(255,255,255,0.1);">
    <div class="container header-container" style="justify-content:space-between;">
      <a href="index.html" class="brand-logo" style="color:white;">
        <div class="logo-icon" style="background:#2E7D32;"><i class="fas fa-crown"></i></div>
        <span>Fresh</span>Cart <span style="font-size:0.8rem; background:rgba(255,255,255,0.2); color:white; padding:2px 8px; border-radius:4px; margin-left:6px;">Owner Admin</span>
      </a>
      <a href="index.html" style="color:#A5D66A; text-decoration:none; font-weight:600; font-size:0.9rem;">
        <i class="fas fa-store"></i> Store Front
      </a>
    </div>
  </header>

  <main class="container" style="flex:1; display:flex; align-items:center; justify-content:center; padding:40px 16px;">
    <div style="background:white; border-radius:16px; border:1px solid #e2e8f0; box-shadow:0 12px 36px rgba(0,0,0,0.3); width:100%; max-width:440px; padding:36px 32px;">
      
      <div style="text-align:center; margin-bottom:24px;">
        <div style="width:54px; height:54px; border-radius:50%; background:#113820; color:#A5D66A; display:flex; align-items:center; justify-content:center; font-size:1.5rem; margin:0 auto 12px;">
          <i class="fas fa-user-shield"></i>
        </div>
        <h1 style="font-size:1.6rem; font-weight:800; color:var(--text-dark); margin:0 0 6px;">Shop Owner Portal</h1>
        <p style="color:var(--text-muted); font-size:0.88rem; margin:0;">Enterprise Business Management & Financial Intelligence</p>
      </div>

      <!-- Quick Demo Fill -->
      <div style="background:#f1f8e9; border:1px dashed #2E7D32; border-radius:8px; padding:10px 14px; margin-bottom:20px; font-size:0.82rem; color:#1B5E35; display:flex; justify-content:space-between; align-items:center;">
        <div>
          <strong>Store Owner Account:</strong><br>
          owner@freshcart.com / owner123
        </div>
        <button type="button" class="btn btn-outline" style="padding:4px 10px; font-size:0.75rem; background:white;" onclick="fillDemoOwner()">Auto Fill</button>
      </div>

      <form id="owner-login-form" onsubmit="handleOwnerLogin(event)">
        <div class="form-group" style="margin-bottom:16px;">
          <label style="font-size:0.85rem; font-weight:600; display:block; margin-bottom:4px;">Owner Email Address</label>
          <input type="email" id="owner-email" class="form-control" placeholder="owner@freshcart.com" required style="width:100%; padding:10px 12px; border:1px solid #ccc; border-radius:6px;">
        </div>

        <div class="form-group" style="margin-bottom:20px;">
          <label style="font-size:0.85rem; font-weight:600; display:block; margin-bottom:4px;">Master Password</label>
          <input type="password" id="owner-password" class="form-control" placeholder="••••••••" required style="width:100%; padding:10px 12px; border:1px solid #ccc; border-radius:6px;">
        </div>

        <button type="submit" class="btn btn-primary" style="background:#113820; border-color:#113820; width:100%; padding:12px; font-weight:700; border-radius:6px; font-size:1rem;">
          <i class="fas fa-lock"></i> Authorize & Enter Admin Portal
        </button>
      </form>

      <hr style="border:0; border-top:1px solid #eee; margin:24px 0 16px;">

      <div style="font-size:0.8rem; color:#777; text-align:center;">
        Protected administrative area. Non-owner login attempts are strictly blocked.<br>
        <div style="margin-top:6px;">
          <a href="customer-login.html" style="color:var(--primary); font-weight:600; text-decoration:underline;">Customer Login</a> &bull; 
          <a href="worker-login.html" style="color:var(--primary); font-weight:600; text-decoration:underline;">Worker Login</a>
        </div>
      </div>
    </div>
  </main>

  <script src="js/config.js"></script>
  <script src="js/validation.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/script.js"></script>

  <script>
    function fillDemoOwner() {
      document.getElementById('owner-email').value = 'owner@freshcart.com';
      document.getElementById('owner-password').value = 'owner123';
    }

    async function handleOwnerLogin(e) {
      e.preventDefault();
      const email = document.getElementById('owner-email').value;
      const pass = document.getElementById('owner-password').value;

      const result = await AuthEngine.login(email, pass, 'owner');
      if (result.success) {
        if (typeof showToast === 'function') {
          showToast('Owner Verified', 'Access granted to FreshCart Business Console.', 'success');
        }
        setTimeout(() => {
          window.location.href = 'owner-dashboard.html';
        }, 500);
      } else {
        alert(result.message);
      }
    }
  </script>
</body>
</html>
