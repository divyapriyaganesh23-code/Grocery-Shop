<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Packing Station & Checklist - FreshCart Worker Portal</title>
  
  <link rel="icon" href="images/categories/fruits.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/worker.css">
  <link rel="stylesheet" href="css/responsive.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body style="background:#f4f6f8;">

  <header class="main-header" style="background:white; border-bottom:1px solid #e2e8f0;">
    <div class="container header-container" style="justify-content:space-between;">
      <a href="worker-dashboard.html" class="brand-logo">
        <div class="logo-icon" style="background:linear-gradient(135deg, #2E7D32, #4CAF50);"><i class="fas fa-boxes-packing"></i></div>
        <span>Fresh</span>Cart <span style="font-size:0.8rem; background:#e8f5e9; color:#2e7d32; padding:2px 8px; border-radius:4px; margin-left:6px;">Packing Station</span>
      </a>
      <a href="worker-dashboard.html" style="color:var(--text-muted); text-decoration:none; font-size:0.85rem;">
        <i class="fas fa-arrow-left"></i> Dashboard
      </a>
    </div>
  </header>

  <div class="worker-app-layout">
    <aside class="worker-sidebar">
      <nav style="display:flex; flex-direction:column; gap:4px;">
        <a href="worker-dashboard.html" class="portal-nav-item"><i class="fas fa-gauge-high"></i> Dashboard</a>
        <a href="worker-orders.html" class="portal-nav-item"><i class="fas fa-clipboard-list"></i> My Assigned Orders</a>
        <a href="packing-tasks.html" class="portal-nav-item active" style="color:#2E7D32; background:#e8f5e9; font-weight:600;"><i class="fas fa-box-open"></i> Packing Station</a>
        <a href="delivery-tasks.html" class="portal-nav-item"><i class="fas fa-truck-ramp-box"></i> Doorstep Deliveries</a>
        <a href="worker-attendance.html" class="portal-nav-item"><i class="fas fa-business-time"></i> My Attendance</a>
        <hr style="border:0; border-top:1px solid #eee; margin:16px 0;">
        <a href="javascript:void(0)" class="portal-nav-item text-danger" onclick="AuthEngine.logout('worker-login.html')"><i class="fas fa-arrow-right-from-bracket"></i> Sign Out</a>
      </nav>
    </aside>

    <main class="worker-main-content">
      <!-- Order Selector Dropdown -->
      <div style="display:flex; justify-content:space-between; align-items:flex-end; margin-bottom:24px; flex-wrap:wrap; gap:16px;">
        <div>
          <h1 style="font-size:1.8rem; font-weight:800; color:var(--text-dark); margin:0 0 4px;">Grocery Packing Station</h1>
          <p style="color:var(--text-muted); font-size:0.9rem; margin:0;">Verify items from shelves, check freshness, and seal into FreshCart eco-bags.</p>
        </div>

        <div style="display:flex; align-items:center; gap:10px;">
          <label style="font-size:0.85rem; font-weight:600;">Select Order to Pack:</label>
          <select id="packing-order-select" class="form-control" onchange="switchPackingOrder(this.value)" style="padding:8px 14px; border:1px solid #ccc; border-radius:6px; font-weight:700; color:#2E7D32;">
            <!-- Populated by script -->
          </select>
        </div>
      </div>

      <!-- Packing Card -->
      <div class="packing-card" id="packing-station-card">
        <!-- Rendered by script -->
      </div>
    </main>
  </div>

  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/products.js"></script>
  <script src="js/orders.js"></script>
  <script src="js/worker.js"></script>
  <script src="js/script.js"></script>

  <script>
    let currentOrder = null;

    document.addEventListener('DOMContentLoaded', () => {
      const user = window.AuthEngine ? AuthEngine.getCurrentUser() : null;
      if (!user || (user.role !== 'worker' && user.role !== 'owner')) {
        window.location.href = 'worker-login.html';
        return;
      }

      const myOrders = WorkerEngine.getMyAssignedOrders();
      const packableOrders = myOrders.filter(o => ['Confirmed', 'Preparing', 'Packing', 'Packed'].includes(o.status));

      const select = document.getElementById('packing-order-select');
      const urlParams = new URLSearchParams(window.location.search);
      const queryOrderId = urlParams.get('orderId');

      if (packableOrders.length === 0) {
        document.getElementById('packing-station-card').innerHTML = `
          <div style="padding:50px; text-align:center; color:#888;">
            <i class="fas fa-box-open" style="font-size:3rem; color:#ccc; margin-bottom:12px;"></i>
            <h3>No Orders Awaiting Packing</h3>
            <p>All assigned orders are either already dispatched or delivered.</p>
            <a href="worker-orders.html" class="btn btn-outline" style="margin-top:12px;">View All Assigned</a>
          </div>
        `;
        select.innerHTML = '<option>None</option>';
        return;
      }

      select.innerHTML = packableOrders.map(o => `
        <option value="${o.id}" ${(queryOrderId === o.id || (!queryOrderId && o === packableOrders[0])) ? 'selected' : ''}>
          #${o.id} - ${o.customerName} (${o.items.length} items) [${o.status}]
        </option>
      `).join('');

      const targetId = queryOrderId || packableOrders[0].id;
      loadPackingOrder(targetId);
    });

    function switchPackingOrder(orderId) {
      loadPackingOrder(orderId);
      const newUrl = window.location.protocol + "//" + window.location.host + window.location.pathname + '?orderId=' + orderId;
      window.history.pushState({path:newUrl},'',newUrl);
    }

    function loadPackingOrder(orderId) {
      currentOrder = OrdersEngine.getOrderById(orderId);
      const card = document.getElementById('packing-station-card');
      if (!currentOrder || !card) return;

      const isPackedAlready = currentOrder.status === 'Packed';

      card.innerHTML = `
        <div class="packing-card-header">
          <div>
            <div style="display:flex; align-items:center; gap:10px;">
              <h3 style="margin:0; font-size:1.25rem; color:#2E7D32;">Order #${currentOrder.id}</h3>
              <span class="badge ${isPackedAlready ? 'badge-success' : 'badge-warning'}">${currentOrder.status}</span>
            </div>
            <div style="font-size:0.85rem; color:#666; margin-top:4px;">
              <strong>Recipient:</strong> ${currentOrder.customerName} (${currentOrder.phone}) &bull; 
              <strong>Delivery Slot:</strong> ${currentOrder.deliverySlotText || 'Express'}
            </div>
            ${currentOrder.specialInstructions ? `
              <div style="font-size:0.82rem; color:#c62828; margin-top:4px;">
                <i class="fas fa-note-sticky"></i> <strong>Special Instructions:</strong> "${currentOrder.specialInstructions}"
              </div>
            ` : ''}
          </div>

          <div>
            ${!isPackedAlready ? `
              <button class="btn btn-primary" style="background:#2E7D32; border-color:#2E7D32; padding:10px 20px; font-weight:700;" onclick="completePackingOrder()">
                <i class="fas fa-box-check"></i> Complete & Seal Packing
              </button>
            ` : `
              <a href="delivery-tasks.html?orderId=${currentOrder.id}" class="btn btn-primary" style="background:#0288D1; border-color:#0288D1; padding:10px 20px; font-weight:700;">
                <i class="fas fa-truck-fast"></i> Proceed to Delivery
              </a>
            `}
          </div>
        </div>

        <ul class="packing-items-list">
          ${currentOrder.items.map((item, idx) => `
            <li class="packing-item-row ${item.isPacked ? 'is-packed' : ''} ${item.isMissing ? 'is-issue' : ''}">
              <div style="display:flex; align-items:center; gap:16px;">
                <input type="checkbox" class="packing-checkbox" ${item.isPacked ? 'checked' : ''} onchange="handleItemCheck('${currentOrder.id}', ${item.id}, this.checked)">
                <div style="width:48px; height:48px; border-radius:8px; background:#f0f4f1; display:flex; align-items:center; justify-content:center; overflow:hidden;">
                  <i class="fas fa-leaf" style="color:#2E7D32; font-size:1.2rem;"></i>
                </div>
                <div>
                  <div class="item-name" style="font-weight:700; font-size:1rem; color:#252525;">${item.name}</div>
                  <small style="color:#666;">Quantity: <strong>${item.quantity}</strong> &times; ${item.unit || '1 unit'} &bull; Shelf Line Total: ₹${item.lineTotal || (item.price * item.quantity)}</small>
                  ${item.isMissing ? `<div style="color:#c62828; font-size:0.8rem; font-weight:600;"><i class="fas fa-triangle-exclamation"></i> Flagged: ${item.issueReason} (Substitute: ${item.substituteRequested || 'None'})</div>` : ''}
                </div>
              </div>

              <div>
                ${!item.isPacked && !item.isMissing ? `
                  <button type="button" class="btn btn-outline text-danger" style="padding:4px 10px; font-size:0.75rem;" onclick="WorkerEngine.promptItemIssueModal('${currentOrder.id}', ${item.id}, '${item.name}')">
                    <i class="fas fa-flag"></i> Report Issue / Substitute
                  </button>
                ` : ''}
                ${item.isPacked ? `<span style="color:#2E7D32; font-weight:700; font-size:0.85rem;"><i class="fas fa-circle-check"></i> Packed</span>` : ''}
              </div>
            </li>
          `).join('')}
        </ul>
      `;
    }

    function handleItemCheck(orderId, itemId, checked) {
      WorkerEngine.toggleItem(orderId, itemId, checked);
      loadPackingOrder(orderId);
    }

    function completePackingOrder() {
      if (!currentOrder) return;
      const success = WorkerEngine.completePacking(currentOrder.id);
      if (success) {
        loadPackingOrder(currentOrder.id);
      }
    }
  </script>
</body>
</html>
