<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tax Invoice - FreshCart</title>
  
  <link rel="icon" href="images/categories/fruits.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/customer.css">
  <link rel="stylesheet" href="css/responsive.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body style="background:#f4f6f8; padding:30px 16px;">

  <div id="invoice-mount">
    <!-- Populated by BillingEngine -->
  </div>

  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/orders.js"></script>
  <script src="js/billing.js"></script>
  <script src="js/script.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);
      const orderId = urlParams.get('orderId');

      const allOrders = typeof OrdersEngine !== 'undefined' ? OrdersEngine.getAllOrders() : [];
      const order = allOrders.find(o => o.id === orderId || o.invoiceNumber === orderId) || allOrders[0];

      if (!order) {
        document.getElementById('invoice-mount').innerHTML = `
          <div style="text-align:center; padding:50px;">
            <h3>Invoice Not Found</h3>
            <p>Could not locate the requested order invoice.</p>
            <a href="index.html" class="btn btn-primary">Back to Store</a>
          </div>
        `;
        return;
      }

      BillingEngine.renderInvoice('invoice-mount', order);
    });
  </script>
</body>
</html>
