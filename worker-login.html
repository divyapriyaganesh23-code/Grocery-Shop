<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Worker Fulfillment Sign In - FreshCart</title>
  
  <link rel="icon" href="images/categories/fruits.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/worker.css">
  <link rel="stylesheet" href="css/responsive.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body style="background:#f4f6f8; min-height:100vh; display:flex; flex-direction:column;">

  <!-- Header -->
  <header class="main-header" style="background:white; border-bottom:1px solid #e2e8f0;">
    <div class="container header-container" style="justify-content:space-between;">
      <a href="index.html" class="brand-logo">
        <div class="logo-icon" style="background:linear-gradient(135deg, #2E7D32, #4CAF50);"><i class="fas fa-boxes-packing"></i></div>
        <span>Fresh</span>Cart <span style="font-size:0.8rem; background:#e8f5e9; color:#2e7d32; padding:2px 8px; border-radius:4px; margin-left:6px;">Staff</span>
      </a>
      <a href="index.html" style="color:var(--primary); text-decoration:none; font-weight:600; font-size:0.9rem;">
        <i class="fas fa-store"></i> Store Front
      </a>
    </div>
  </header>

  <main class="container" style="flex:1; display:flex; align-items:center; justify-content:center; padding:40px 16px;">
    <div style="background:white; border-radius:16px; border:1px solid #e2e8f0; box-shadow:var(--shadow-md); width:100%; max-width:440px; padding:36px 32px;">
      
      <div style="text-align:center; margin-bottom:24px;">
        <div style="width:54px; height:54px; border-radius:50%; background:#e8f5e9; color:#2e7d32; display:flex; align-items:center; justify-content:center; font-size:1.5rem; margin:0 auto 12px;">
          <i class="fas fa-clipboard-check"></i>
        </div>
        <h1 style="font-size:1.6rem; font-weight:800; color:var(--text-dark); margin:0 0 6px;">Worker Portal Sign In</h1>
        <p style="color:var(--text-muted); font-size:0.88rem; margin:0;">Order Fulfillment, Packing Station & Doorstep OTP Dispatch</p>
      </div>

      <!-- Quick Demo Fill -->
      <div style="background:#f1f8e9; border:1px dashed #4CAF50; border-radius:8px; padding:10px 14px; margin-bottom:20px; font-size:0.82rem; color:#2e7d32; display:flex; justify-content:space-between; align-items:center;">
        <div>
          <strong>Demo Worker (EMP-101):</strong><br>
          worker@freshcart.com / worker123
        </div>
        <button type="button" class="btn btn-outline" style="padding:4px 10px; font-size:0.75rem; background:white;" onclick="fillDemoWorker()">Auto Fill</button>
      </div>

      <form id="worker-login-form" onsubmit="handleWorkerLogin(event)">
        <div class="form-group" style="margin-bottom:16px;">
          <label style="font-size:0.85rem; font-weight:600; display:block; margin-bottom:4px;">Worker Email Address</label>
          <input type="email" id="worker-email" class="form-control" placeholder="worker@freshcart.com" required style="width:100%; padding:10px 12px; border:1px solid #ccc; border-radius:6px;">
        </div>

        <div class="form-group" style="margin-bottom:20px;">
          <label style="font-size:0.85rem; font-weight:600; display:block; margin-bottom:4px;">Password</label>
          <input type="password" id="worker-password" class="form-control" placeholder="••••••••" required style="width:100%; padding:10px 12px; border:1px solid #ccc; border-radius:6px;">
        </div>

        <button type="submit" class="btn btn-primary" style="background:#2E7D32; border-color:#2E7D32; width:100%; padding:12px; font-weight:700; border-radius:6px; font-size:1rem;">
          <i class="fas fa-right-to-bracket"></i> Sign In to Fulfillment Station
        </button>
      </form>

      <hr style="border:0; border-top:1px solid #eee; margin:24px 0 16px;">

      <div style="font-size:0.8rem; color:#777; text-align:center;">
        Worker accounts are provisioned exclusively by the Shop Owner.<br>
        <div style="margin-top:6px;">
          <a href="owner-login.html" style="color:var(--primary); font-weight:600; text-decoration:underline;">Switch to Owner Portal</a>
        </div>
      </div>
    </div>
  </main>

  <script src="js/config.js"></script>
  <script src="js/validation.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/script.js"></script>

  <script>
    function fillDemoWorker() {
      document.getElementById('worker-email').value = 'worker@freshcart.com';
      document.getElementById('worker-password').value = 'worker123';
    }

    async function handleWorkerLogin(e) {
      e.preventDefault();
      const email = document.getElementById('worker-email').value;
      const pass = document.getElementById('worker-password').value;

      const result = await AuthEngine.login(email, pass, 'worker');
      if (result.success) {
        if (typeof showToast === 'function') {
          showToast('Staff Access Verified', `Signed in as ${result.user.name} (${result.user.employeeId || 'Staff'})`, 'success');
        }
        setTimeout(() => {
          window.location.href = 'worker-dashboard.html';
        }, 500);
      } else {
        alert(result.message);
      }
    }
  </script>
</body>
</html>
