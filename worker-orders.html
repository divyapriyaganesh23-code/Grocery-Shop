<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Assigned Orders - FreshCart Worker Portal</title>
  
  <link rel="icon" href="images/categories/fruits.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/worker.css">
  <link rel="stylesheet" href="css/responsive.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body style="background:#f4f6f8;">

  <header class="main-header" style="background:white; border-bottom:1px solid #e2e8f0;">
    <div class="container header-container" style="justify-content:space-between;">
      <a href="worker-dashboard.html" class="brand-logo">
        <div class="logo-icon" style="background:linear-gradient(135deg, #2E7D32, #4CAF50);"><i class="fas fa-boxes-packing"></i></div>
        <span>Fresh</span>Cart <span style="font-size:0.8rem; background:#e8f5e9; color:#2e7d32; padding:2px 8px; border-radius:4px; margin-left:6px;">Staff Portal</span>
      </a>
      <a href="worker-dashboard.html" style="color:var(--text-muted); text-decoration:none; font-size:0.85rem;">
        <i class="fas fa-arrow-left"></i> Dashboard
      </a>
    </div>
  </header>

  <div class="worker-app-layout">
    <aside class="worker-sidebar">
      <nav style="display:flex; flex-direction:column; gap:4px;">
        <a href="worker-dashboard.html" class="portal-nav-item"><i class="fas fa-gauge-high"></i> Dashboard</a>
        <a href="worker-orders.html" class="portal-nav-item active" style="color:#2E7D32; background:#e8f5e9; font-weight:600;"><i class="fas fa-clipboard-list"></i> My Assigned Orders</a>
        <a href="packing-tasks.html" class="portal-nav-item"><i class="fas fa-box-open"></i> Packing Station</a>
        <a href="delivery-tasks.html" class="portal-nav-item"><i class="fas fa-truck-ramp-box"></i> Doorstep Deliveries</a>
        <a href="worker-attendance.html" class="portal-nav-item"><i class="fas fa-business-time"></i> My Attendance</a>
        <hr style="border:0; border-top:1px solid #eee; margin:16px 0;">
        <a href="javascript:void(0)" class="portal-nav-item text-danger" onclick="AuthEngine.logout('worker-login.html')"><i class="fas fa-arrow-right-from-bracket"></i> Sign Out</a>
      </nav>
    </aside>

    <main class="worker-main-content">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; flex-wrap:wrap; gap:12px;">
        <div>
          <h1 style="font-size:1.8rem; font-weight:800; color:var(--text-dark); margin:0 0 4px;">My Assigned Orders</h1>
          <p style="color:var(--text-muted); font-size:0.9rem; margin:0;">Complete list of store orders assigned to you by the owner.</p>
        </div>

        <div style="display:flex; gap:8px;">
          <button class="btn btn-outline filter-btn active" onclick="filterOrders('all', this)" style="padding:6px 14px; font-size:0.8rem;">All</button>
          <button class="btn btn-outline filter-btn" onclick="filterOrders('packing', this)" style="padding:6px 14px; font-size:0.8rem;">Packing</button>
          <button class="btn btn-outline filter-btn" onclick="filterOrders('delivery', this)" style="padding:6px 14px; font-size:0.8rem;">Delivery</button>
          <button class="btn btn-outline filter-btn" onclick="filterOrders('delivered', this)" style="padding:6px 14px; font-size:0.8rem;">Delivered</button>
        </div>
      </div>

      <div class="fresh-card" style="background:white; border-radius:12px; border:1px solid #e2e8f0; padding:24px;">
        <div style="overflow-x:auto;">
          <table class="admin-table" style="width:100%;">
            <thead>
              <tr>
                <th>Order ID</th>
                <th>Customer</th>
                <th>Address & Phone</th>
                <th>Delivery Schedule</th>
                <th>Items</th>
                <th>Status</th>
                <th style="text-align:right;">Action</th>
              </tr>
            </thead>
            <tbody id="worker-all-orders-tbody">
              <!-- Populated by script -->
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/products.js"></script>
  <script src="js/orders.js"></script>
  <script src="js/worker.js"></script>
  <script src="js/script.js"></script>

  <script>
    let currentFilter = 'all';

    document.addEventListener('DOMContentLoaded', () => {
      const user = window.AuthEngine ? AuthEngine.getCurrentUser() : null;
      if (!user || (user.role !== 'worker' && user.role !== 'owner')) {
        window.location.href = 'worker-login.html';
        return;
      }
      renderTable();
    });

    function filterOrders(type, btn) {
      currentFilter = type;
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderTable();
    }

    function renderTable() {
      const myOrders = WorkerEngine.getMyAssignedOrders();
      let filtered = myOrders;

      if (currentFilter === 'packing') {
        filtered = myOrders.filter(o => ['Confirmed', 'Preparing', 'Packing'].includes(o.status));
      } else if (currentFilter === 'delivery') {
        filtered = myOrders.filter(o => ['Packed', 'Ready for Delivery'].includes(o.status));
      } else if (currentFilter === 'delivered') {
        filtered = myOrders.filter(o => o.status === 'Delivered');
      }

      const tbody = document.getElementById('worker-all-orders-tbody');
      if (filtered.length === 0) {
        tbody.innerHTML = '<tr><td colspan="7" style="text-align:center; padding:30px; color:#888;">No orders found in this filter category.</td></tr>';
        return;
      }

      tbody.innerHTML = filtered.map(o => `
        <tr>
          <td style="font-weight:700; color:#2E7D32;">#${o.id}</td>
          <td>
            <div style="font-weight:600;">${o.customerName}</div>
            <small style="color:#777;">${o.phone}</small>
          </td>
          <td style="max-width:240px; font-size:0.82rem; color:#555;">${o.deliveryAddress}</td>
          <td>
            <div style="font-size:0.85rem;">${o.deliveryDate}</div>
            <small style="color:#666;">${o.deliverySlotText || 'Standard'}</small>
          </td>
          <td>${o.items.length} item(s)</td>
          <td><span class="badge ${getStatusBadge(o.status)}">${o.status}</span></td>
          <td style="text-align:right;">
            ${['Confirmed', 'Preparing', 'Packing'].includes(o.status) ? 
              `<a href="packing-tasks.html?orderId=${o.id}" class="btn btn-primary" style="padding:6px 12px; font-size:0.8rem; background:#2E7D32; border-color:#2E7D32;">Pack</a>` :
              (['Packed', 'Ready for Delivery'].includes(o.status) ? 
                `<a href="delivery-tasks.html?orderId=${o.id}" class="btn btn-primary" style="padding:6px 12px; font-size:0.8rem; background:#0288D1; border-color:#0288D1;">Deliver (OTP)</a>` : 
                `<span style="color:#2E7D32; font-weight:700; font-size:0.85rem;"><i class="fas fa-check"></i> Done</span>`)
            }
          </td>
        </tr>
      `).join('');
    }

    function getStatusBadge(status) {
      if (status === 'Delivered') return 'badge-success';
      if (status === 'Cancelled') return 'badge-danger';
      return 'badge-info';
    }
  </script>
</body>
</html>
